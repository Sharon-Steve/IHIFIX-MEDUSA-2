services:
  postgres:                      # Layer 2: the database
    image: postgres:15-alpine
    container_name: medusa_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: medusa-store
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres        # default password (risk)
    ports:
      - "5432:5432"                      # database reachable from outside Docker (risk)
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./medusa-seed.sql:/docker-entrypoint-initdb.d/seed.sql   # loads starter data on first start
    healthcheck:                         # "is it READY?", not just "has it started?"
      test: ["CMD-SHELL", "pg_isready -U postgres -d medusa-store"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - medusa_network

  redis:                         # Layer 3: the cache
    image: redis:7-alpine
    container_name: medusa_redis
    restart: unless-stopped
    ports:
      - "6379:6379"                      # no password, reachable from outside (risk)
    networks:
      - medusa_network

  medusa:                        # Layer 1: the application
    build: .
    container_name: medusa_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "9000:9000"                      # API and Admin dashboard
      - "5173:5173"                      # Admin dev server
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/medusa-store?sslmode=disable
      REDIS_URL: redis://redis:6379
      STORE_CORS: http://localhost:8000,https://docs.medusajs.com
      ADMIN_CORS: http://localhost:5173,http://localhost:9000,https://docs.medusajs.com
      AUTH_CORS: http://localhost:5173,http://localhost:9000,https://docs.medusajs.com
      JWT_SECRET: supersecret            # weak lab secrets (risk)
      COOKIE_SECRET: supersecret
    networks:
      - medusa_network

volumes:
  postgres_data:

networks:
  medusa_network:
    driver: bridge
